<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Pagination Test</title></head>
<body>
  <section th:with="result=${wishFinder.listPublic(1, 5)}"
           th:attr="data-total=${result.total},data-page=${result.page},data-size=${result.size}">
    <article th:each="wish : ${result.items}" th:attr="data-public-name=${wish.metadata.name}">
      <p th:text="${wish.spec.content}"></p><span th:text="${wish.spec.nickname}"></span>
    </article>
  </section>
  <section th:with="result=${wishFinder.listPublic(1, 2, 'wish', 'doing', 'createdAt,desc')}"
           th:attr="data-filtered-total=${result.total}">
    <article th:each="wish : ${result.items}" th:attr="data-filtered-name=${wish.metadata.name}">
      <p th:text="${wish.spec.content}"></p>
    </article>
  </section>
  <span th:attr="data-legacy-total=${wishFinder.countApproved()}"></span>
</body>
</html>
